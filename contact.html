<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="დაგვიკავშირდით BMW კლუბის წევრობისთვის ან კითხვებისთვის.">
    <title>BMW Georgia - კონტაქტი</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">BMW <span>POWER</span></div>
        <nav>
            <ul>
                <li><a href="index.html">მთავარი</a></li>
                <li><a href="models.html">მოდელები</a></li>
                <li><a href="about.html">ჩვენ შესახებ</a></li>
                <li><a href="contact.html" class="active">კონტაქტი</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h2>დაგვიკავშირდით</h2>
        
        <form class="contact-form" action="#" method="POST">
            <div class="form-group">
                <label for="name">სახელი:</label>
                <input type="text" id="name" name="name" placeholder="შეიყვანეთ თქვენი სახელი" required>
            </div>
            
            <div class="form-group">
                <label for="email">ელ-ფოსტა:</label>
                <input type="email" id="email" name="email" placeholder="example@mail.com" required>
            </div>

            <div class="form-group">
                <label for="message">შეტყობინება:</label>
                <textarea id="message" name="message" rows="5" placeholder="დაწერეთ თქვენი შეტყობინება..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">გაგზავნა</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 BMW Fan Club Georgia. ყველა უფლება დაცულია.</p>
    </footer>

</body>
</html>
